name: pasyalph_supabase_flutter
description: Android-first PasyalPH migration using Supabase
publish_to: none
version: 0.3.0+2
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.18.3
  flutter_map: ^8.2.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  geolocator: ^14.0.2
  file_picker: ^13.3.2
  shared_preferences: ^2.5.3
  cupertino_icons: 2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
